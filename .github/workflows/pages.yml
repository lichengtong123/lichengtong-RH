name: 发布网站（GitHub Pages）

# 网站内容来自 main 分支；同行审阅稿不入库，构建时从最新的 Release 下载后一并发布。
# 触发：推送 main、发布新的 Release，或手动运行。

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 从最新 Release 下载同行审阅稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern 'PrimeCounting-RH-Review-*' \
            --dir 'docs/同行审阅' --clobber
          # Release 附件只能用 ASCII 文件名；网站上按书稿原文件名提供下载
          cd 'docs/同行审阅'
          mv PrimeCounting-RH-Review-zh.pdf  '素数计数与黎曼猜想-预印本-同行审阅-加密.pdf'
          mv PrimeCounting-RH-Review-zh.docx '素数计数与黎曼猜想-预印本-同行审阅-加密.docx'
          # 兼容旧链接：2026-11-14 前文件名用“预印版”，保留同内容副本
          cp '素数计数与黎曼猜想-预印本-同行审阅-加密.pdf'  '素数计数与黎曼猜想-预印版-同行审阅-加密.pdf'
          cp '素数计数与黎曼猜想-预印本-同行审阅-加密.docx' '素数计数与黎曼猜想-预印版-同行审阅-加密.docx'
          mv PrimeCounting-RH-Review-en.pdf  'Prime-Counting-and-the-Riemann-Hypothesis-Review-Encrypted.pdf'
          ls -l *.pdf *.docx

      - name: 用 Jekyll 构建站点
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
