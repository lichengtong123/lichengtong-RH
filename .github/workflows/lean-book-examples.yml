name: 命题的形式化验证-Lean4检查

on:
  push:
    paths:
      - '命题的形式化验证-Lean4/**'
      - '.github/workflows/lean-book-examples.yml'
  pull_request:
    paths:
      - '命题的形式化验证-Lean4/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查没有用 axiom 声明新公理
        run: |
          if grep -rnE '^[[:space:]]*(private[[:space:]]+)?axiom[[:space:]]' --include='*.lean' 命题的形式化验证-Lean4; then
            echo "发现 axiom 声明"; exit 1
          fi
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: 命题的形式化验证-Lean4
          build-args: "--wfail"
