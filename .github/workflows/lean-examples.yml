name: Lean 示例检查

on:
  push:
    paths:
      - 'Lean示例/**'
      - '.github/workflows/lean-examples.yml'
  pull_request:
    paths:
      - 'Lean示例/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean示例
      - name: 汇总编译错误
        if: failure()
        working-directory: Lean示例
        run: |
          lake build 2>&1 | grep -A3 -E "^error" | head -60 | tr '\n' ' ' | sed 's/error: /\n::error::/g'
