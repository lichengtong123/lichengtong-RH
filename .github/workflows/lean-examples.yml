name: 形式化证明-Lean示例检查

on:
  push:
    paths:
      - '形式化证明-Lean示例/**'
      - '.github/workflows/lean-examples.yml'
  pull_request:
    paths:
      - '形式化证明-Lean示例/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: 形式化证明-Lean示例
